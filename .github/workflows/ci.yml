name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end against the real orchestrator
    runs-on: ubuntu-latest
    needs: check
    env:
      VITE_API_URL: http://localhost:8000
      ORCHESTRATOR_DB: ${{ github.workspace }}/orchestrator.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kauan287/healthtech-agent-orchestrator
          path: orchestrator
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: orchestrator/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Start the orchestrator
        working-directory: orchestrator
        run: |
          uv sync --frozen
          ENVIRONMENT=development LLM_PROVIDER=demo \
          DATABASE_URL="sqlite:///$ORCHESTRATOR_DB" CORS_ORIGINS=http://localhost:4173 \
          FHIR_BASE_URL=http://localhost:8090/fhir \
            nohup uv run uvicorn src.server:app --port 8000 > ../orchestrator.log 2>&1 &
      - name: Wait for /health/ready
        run: |
          for _ in $(seq 60); do
            curl -sf "$VITE_API_URL/health/ready" && exit 0
            sleep 1
          done
          cat orchestrator.log
          exit 1

      - run: npm ci
      - name: Contract drift check
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - name: Playwright against vite preview and the fake FHIR server
        run: npm run test:e2e
        env:
          CI: true

      - name: Orchestrator logs
        if: failure()
        run: cat orchestrator.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
